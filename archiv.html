<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span><strong>Dynamo</strong> Deník</span>
      <small>neoficiální fanouškovský web</small>

    <nav class="mainnav">

<div class="strap">
  <div class="wrap">
    <span>Sezóna 2026/27 · Ročník I</span>
    <span>Neoficiální fanouškovský list</span>
  </div>
</div>

<div class="wrap">
  <div class="hero" style="padding-left:0;padding-right:0;border-bottom:none;">
    <p class="eyebrow">Sezóna po sezóně</p>
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);">Archiv</h1>

  </div>

<script src="assets/site.js"></script>
<script>
// Sezóna se bere z data zápasu: červenec-prosinec patří do "podzim", leden-červen do "jaro" téhož ročníku.
function seasonLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1;
  return m >= 7 ? `${y}/${String(y + 1).slice(2)}` : `${y - 1}/${String(y).slice(2)}`;
}

(async function () {
  const reports = await loadJSON("reports.json") || [];
  const el = document.getElementById("seasons");
  if (!reports.length) {
    el.innerHTML = `<div class="empty">Archiv se naplní automaticky, jakmile přibudou reportáže z více sezón.</div>`;
    return;
  }
  const groups = {};
  reports.forEach(r => {
    const s = seasonLabel(r.date);
    (groups[s] = groups[s] || []).push(r);
  });
  const seasons = Object.keys(groups).sort().reverse();
  el.innerHTML = seasons.map(s => `
    <div class="section-head"><h2>Sezóna ${s}</h2></div>
    <div class="card-grid">
      ${groups[s].sort((a,b) => new Date(b.date)-new Date(a.date)).map(reportCardHTML).join("")}
    </div>
  `).join("");
})();
</script>
</body>
</html>
